<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f8" />
  <title>期限チェッカー MVP v3.6</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #f5f5f7;
      --card: #fff;
      --border: #e5e5e7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f7; }
    body.scanner-mode { overflow:hidden; overscroll-behavior:none; touch-action:none; }
    .app { max-width: 760px; margin: 0 auto; padding: 20px 16px 100px; }
    h1 { font-size: 28px; margin: 0; }
    .app-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 4px; }
    .icon-button { display:grid; place-items:center; width:44px; height:44px; border:1px solid #d8d8dc; border-radius:14px; background:white; font-size:22px; cursor:pointer; }
    .sub { color:#666; margin:0 0 20px; font-size:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; margin:12px 0; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .summary button { border:0; border-radius:14px; padding:12px 8px; font:inherit; cursor:pointer; }
    .summary .n { display:block; font-size:24px; font-weight:700; margin-top:3px; }
    .expired { background:#ffe8e8; }
    .thismonth { background:#fff0dd; }
    .nextmonth { background:#fff7cf; }
    .within3 { background:#eef4ff; }
    button.primary { width:100%; border:0; border-radius:14px; padding:14px 16px; font-size:16px; font-weight:700; background:#111; color:white; cursor:pointer; }
    button.secondary { width:100%; border:1px solid #ccc; border-radius:14px; padding:12px 16px; background:white; font-size:15px; cursor:pointer; }
    button.danger { border:0; background:#fff0f0; color:#b00020; padding:8px 10px; border-radius:10px; cursor:pointer; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    label { display:block; font-size:13px; color:#555; margin-bottom:5px; }
    input, select, textarea { width:100%; border:1px solid #d8d8dc; border-radius:12px; padding:11px 12px; font-size:16px; background:white; }
    textarea { min-height:85px; resize:vertical; }
    .field { margin:10px 0; }
    .item { display:flex; justify-content:space-between; gap:12px; border-top:1px solid #eee; padding:14px 0; }
    .item:first-child { border-top:0; }
    .item-title { font-weight:700; }
    .meta { color:#666; font-size:13px; line-height:1.55; margin-top:4px; }
    .badge { display:inline-block; font-size:12px; border-radius:999px; padding:4px 8px; margin-bottom:6px; }
    .badge.expired { color:#a40000; }
    .badge.thismonth { color:#9a5200; }
    .badge.nextmonth { color:#7a6500; }
    .badge.within3 { color:#315c9b; }
    .badge.ok { background:#eaf7ee; color:#226b35; }
    .hidden { display:none !important; }
    video { width:100%; border-radius:14px; background:#111; max-height:420px; object-fit:cover; }
    .scanner-note { font-size:13px; color:#666; line-height:1.5; margin-top:10px; }
    .raw-result { word-break:break-all; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; background:#f6f6f8; padding:10px; border-radius:10px; }
    .scan-success { display:flex; align-items:center; gap:10px; margin-top:12px; padding:14px; border:2px solid #2e9b50; border-radius:14px; background:#eaf7ee; color:#185c2d; font-weight:700; }
    .scan-success-icon { display:grid; place-items:center; width:30px; height:30px; flex:0 0 30px; border-radius:50%; background:#2e9b50; color:white; font-size:18px; }
    .scanner-stage { position:relative; overflow:hidden; border-radius:14px; background:#111; }
    .scan-guide { position:absolute; inset:20% 8%; border:3px solid rgba(255,255,255,.92); border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,.24); pointer-events:none; }
    .scan-guide::before, .scan-guide::after { content:""; position:absolute; left:10%; right:10%; height:2px; background:rgba(70,220,110,.9); }
    .scan-guide::before { top:40%; }
    .scan-guide::after { top:60%; }
    .zoom-controls { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; margin-top:10px; }
    .zoom-controls button { border:1px solid #ccc; border-radius:12px; padding:9px; background:white; font-size:18px; font-weight:700; }
    .zoom-value { text-align:center; font-size:13px; color:#555; }
    .empty { color:#777; text-align:center; padding:22px 8px; }
    .toolbar { display:flex; gap:8px; margin-bottom:8px; }
    .toolbar input { flex:1; }
    .screen-header { display:flex; align-items:center; gap:10px; margin:14px 0 8px; }
    .screen-header h2 { margin:0; font-size:21px; }
    .back-button { width:auto; min-width:44px; border:1px solid #d8d8dc; border-radius:12px; padding:9px 11px; background:white; font-size:15px; }
    .home-actions { display:grid; gap:10px; }
    .home-actions button { text-align:left; padding:16px; }
    .home-actions .action-title { display:block; font-weight:700; font-size:17px; }
    .home-actions .action-note { display:block; margin-top:4px; color:#666; font-size:13px; font-weight:400; }
    .scanner-fullscreen { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; width:100%; height:100dvh; background:#050505; color:#fff; }
    .scanner-topbar { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:rgba(0,0,0,.86); }
    .scanner-topbar h2 { margin:0; font-size:18px; }
    .scanner-topbar .back-button { color:#fff; border-color:#555; background:#222; }
    .scanner-fullscreen .card { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; margin:0; padding:0; border:0; border-radius:0; background:#050505; }
    .scanner-fullscreen #scannerBox { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
    .scanner-fullscreen .scanner-stage { flex:1 1 auto; min-height:0; border-radius:0; }
    .scanner-fullscreen video { width:100%; height:100%; max-height:none; border-radius:0; object-fit:cover; }
    .scanner-fullscreen .scan-guide { inset:34% 7%; border-width:3px; }
    .scanner-bottom { flex:0 0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.9); }
    .scanner-bottom .scanner-note { margin:0 0 10px; color:#eee; text-align:center; }
    .scanner-bottom .zoom-controls button, .scanner-bottom .secondary { border-color:#555; background:#222; color:#fff; }
    .scanner-bottom .zoom-value { color:#eee; }
    .scanner-fullscreen .scan-success { position:absolute; top:calc(70px + env(safe-area-inset-top)); left:16px; right:16px; z-index:3; margin:0; }
    dialog { width:min(560px, calc(100% - 28px)); max-height:85vh; padding:0; border:0; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(0,0,0,.38); }
    .dialog-body { padding:18px; overflow:auto; }
    .dialog-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .dialog-header h2 { margin:0; font-size:21px; }
    .settings-section { padding:14px 0; border-top:1px solid #eee; }
    .settings-section:first-of-type { border-top:0; }
    .inline-add { display:grid; grid-template-columns:1fr auto; gap:8px; }
    .location-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid #eee; }
    .location-actions { display:flex; align-items:center; gap:5px; }
    .order-button { width:36px; height:36px; border:1px solid #ccc; border-radius:10px; background:#fff; font-size:17px; }
    .order-button:disabled { opacity:.3; }
    .drag-handle { width:40px; height:40px; border:1px solid #bbb; border-radius:10px; background:#f7f7f8; font-size:20px; cursor:grab; touch-action:none; user-select:none; }
    .drag-handle:active { cursor:grabbing; }
    .location-row.drag-source { opacity:.45; }
    .item-actions { display:grid; gap:6px; align-content:start; }
    .item-actions .secondary { width:auto; padding:8px 10px; font-size:13px; }
    .dialog-actions { display:grid; gap:8px; margin-top:16px; }
    @media (max-width:600px) {
      .summary { grid-template-columns:1fr 1fr; }
      .row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="app-header">
    <h1>期限チェッカー</h1>
    <button id="settingsBtn" class="icon-button" type="button" aria-label="設定">⚙︎</button>
  </div>
  <p class="sub">GS1からGTIN・LOT・有効期限を読み取り、医薬品の期限を月単位で管理するMVP</p>
  <div id="runtimeStatus" class="card" style="padding:10px 12px;font-size:13px;">
    起動確認中…
  </div>

  <div id="homeView" class="app-view">
    <section class="summary">
      <button class="expired" data-filter="expired">期限切れ<span class="n" id="countExpired">0</span></button>
      <button class="thismonth" data-filter="thismonth">今月<span class="n" id="countThis">0</span></button>
      <button class="nextmonth" data-filter="nextmonth">翌月<span class="n" id="countNext">0</span></button>
      <button class="within3" data-filter="within3">3か月以内<span class="n" id="count3">0</span></button>
    </section>
    <section class="card home-actions">
      <button id="openScannerBtn" class="primary" type="button">
        <span class="action-title">📷 カメラで読み取る</span>
        <span class="action-note" style="color:#ddd">GS1バーコードをカメラで読み取ります</span>
      </button>
      <button id="openManualBtn" class="secondary" type="button">
        <span class="action-title">✏️ バーコードなしで登録</span>
        <span class="action-note">商品名や期限をフォームへ直接入力します</span>
      </button>
      <button id="openGs1TextBtn" class="secondary" type="button">
        <span class="action-title">⌨️ GS1文字列を入力</span>
        <span class="action-note">コード文字列が分かる場合の補助入力です</span>
      </button>
      <button id="openImageBtn" class="secondary" type="button">
        <span class="action-title">🖼️ GS1コードの画像を選ぶ</span>
        <span class="action-note">画像は端末内だけで解析し、保存・送信しません</span>
      </button>
      <button id="openListBtn" class="secondary" type="button">
        <span class="action-title">📋 期限順一覧を見る</span>
        <span class="action-note">登録済みデータを期限順に確認します</span>
      </button>
    </section>
  </div>
  <input id="imageInput" class="hidden" type="file" accept="image/*" />

  <div id="scannerView" class="app-view scanner-fullscreen hidden">
    <div class="scanner-topbar">
      <button class="back-button" type="button" data-back-home>← 戻る</button>
      <h2>カメラで読み取る</h2>
    </div>
    <section class="card">
    <div id="scanSuccess" class="scan-success hidden" role="status" aria-live="polite">
      <span class="scan-success-icon" aria-hidden="true">✓</span>
      <span>GS1を読み取りました。カメラを停止しています…</span>
    </div>
    <div id="scannerBox">
      <div class="scanner-stage">
        <video id="video" muted playsinline></video>
        <div class="scan-guide" aria-hidden="true"></div>
      </div>
      <div class="scanner-bottom">
        <p class="scanner-note">コードを枠いっぱいに水平に合わせ、反射を避けて静止してください。</p>
        <div id="zoomControls" class="zoom-controls hidden">
          <button id="zoomOutBtn" type="button" aria-label="縮小">−</button>
          <div id="zoomValue" class="zoom-value">ズーム 1.0×</div>
          <button id="zoomInBtn" type="button" aria-label="拡大">＋</button>
        </div>
        <button id="stopScanBtn" class="secondary" type="button">キャンセル</button>
      </div>
    </div>
    </section>
  </div>

  <div id="manualView" class="app-view hidden">
    <div class="screen-header">
      <button class="back-button" type="button" data-back-home>← 戻る</button>
      <h2>GS1文字列を入力</h2>
    </div>
    <section class="card">
      <p class="scanner-note">括弧付き表記も入力できます。</p>
      <div class="field">
        <textarea id="rawGs1" placeholder="例：(01)04912345678901(17)270300(10)ABC123"></textarea>
      </div>
      <button id="parseBtn" class="primary" type="button">GS1を解析する</button>
    </section>
  </div>

  <div id="registrationView" class="app-view hidden">
    <div class="screen-header">
      <button id="backFromRegistrationBtn" class="back-button" type="button">← 戻る</button>
      <h2 id="registrationTitle">登録内容を確認</h2>
    </div>
    <section class="card">
    <div id="rawDisplay" class="raw-result hidden" style="margin-bottom:12px"></div>
    <div class="field">
      <label>商品名</label>
      <input id="productName" placeholder="例：○○注射液 20mg" />
    </div>
    <div class="row">
      <div class="field">
        <label>GTIN</label>
        <input id="gtin" inputmode="numeric" />
      </div>
      <div class="field">
        <label>LOT</label>
        <input id="lot" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>有効期限（月単位）</label>
        <input id="expiryMonth" type="month" />
      </div>
      <div class="field">
        <label>数量</label>
        <input id="quantity" type="number" min="1" value="1" />
      </div>
    </div>
    <div class="field">
      <label>保管場所</label>
      <select id="location">
        <option value="">選択してください</option>
      </select>
    </div>
    <input id="expiryRaw" type="hidden" />
    <button id="saveBtn" class="primary">この内容で登録する</button>
    </section>
  </div>

  <div id="listView" class="app-view hidden">
    <div class="screen-header">
      <button class="back-button" type="button" data-back-home>← 戻る</button>
      <h2>期限順一覧</h2>
    </div>
    <section class="summary">
      <button class="expired" data-filter="expired">期限切れ<span class="n" id="listCountExpired">0</span></button>
      <button class="thismonth" data-filter="thismonth">今月<span class="n" id="listCountThis">0</span></button>
      <button class="nextmonth" data-filter="nextmonth">翌月<span class="n" id="listCountNext">0</span></button>
      <button class="within3" data-filter="within3">3か月以内<span class="n" id="listCount3">0</span></button>
    </section>
    <section class="card">
    <div class="toolbar">
      <input id="search" placeholder="商品名・LOT・GTINで検索" />
      <button id="showAllBtn" class="secondary" style="width:auto">全件</button>
    </div>
    <div id="filterLabel" class="scanner-note">期限順一覧</div>
    <div id="list"></div>
    </section>
  </div>
</main>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <div class="dialog-body">
    <div class="dialog-header">
      <h2 id="settingsTitle">設定</h2>
      <button id="closeSettingsBtn" class="icon-button" type="button" aria-label="閉じる">×</button>
    </div>
    <section class="settings-section">
      <strong>保管場所</strong>
      <p class="scanner-note">登録画面で選ぶ保管場所を端末内に保存します。≡を長押ししてドラッグできます。</p>
      <div class="inline-add">
        <input id="newLocation" placeholder="例：処置室" />
        <button id="addLocationBtn" class="secondary" type="button" style="width:auto">追加</button>
      </div>
      <div id="locationList" style="margin-top:10px"></div>
    </section>
    <section class="settings-section">
      <strong>データ管理</strong>
      <div style="height:10px"></div>
      <button id="exportBtn" class="secondary" type="button">データを書き出す（JSON）</button>
      <div style="height:8px"></div>
      <button id="exportCsvBtn" class="secondary" type="button">データを書き出す（CSV）</button>
      <div style="height:8px"></div>
      <button id="importBtn" class="secondary" type="button">JSONバックアップを読み込む</button>
      <input id="importInput" class="hidden" type="file" accept="application/json,.json" />
      <div style="height:8px"></div>
      <button id="clearBtn" class="danger" type="button">全登録データを削除</button>
    </section>
  </div>
</dialog>

<dialog id="duplicateDialog" aria-labelledby="duplicateTitle">
  <div class="dialog-body">
    <div class="dialog-header"><h2 id="duplicateTitle">同じ登録があります</h2></div>
    <p id="duplicateMessage" class="scanner-note"></p>
    <div class="dialog-actions">
      <button id="addQuantityBtn" class="primary" type="button">既存の数量へ加算</button>
      <button id="registerSeparateBtn" class="secondary" type="button">別の登録として追加</button>
      <button id="cancelDuplicateBtn" class="secondary" type="button">キャンセル</button>
    </div>
  </div>
</dialog>

<dialog id="importDialog" aria-labelledby="importTitle">
  <div class="dialog-body">
    <div class="dialog-header"><h2 id="importTitle">バックアップを復元</h2></div>
    <p id="importMessage" class="scanner-note"></p>
    <div class="dialog-actions">
      <button id="importAddBtn" class="primary" type="button">現在のデータへ追加</button>
      <button id="importReplaceBtn" class="secondary" type="button">現在のデータを全置換</button>
      <button id="cancelImportBtn" class="secondary" type="button">キャンセル</button>
    </div>
  </div>
</dialog>

<script src="https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js"></script>
<script>
(() => {
  const STORAGE_KEY = "expiry-checker-items-v1";
  const LOCATIONS_KEY = "expiry-checker-locations-v1";
  let storageAvailable = true;
  let items = [];
  let locations = [];
  let filter = "all";
  let controls = null;
  let scannerReader = null;
  let activeVideoTrack = null;
  let zoomState = null;
  let scanSuccessTimer = null;
  let scanHandled = false;
  let registrationSource = "home";
  let editingItemId = null;
  let pendingDuplicate = null;
  let pendingImport = null;
  let locationDragFrom = null;

  const $ = id => document.getElementById(id);

  function loadStorage() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
      const rawLocations = window.localStorage.getItem(LOCATIONS_KEY);
      locations = rawLocations ? JSON.parse(rawLocations) : [];
      items.forEach(item => {
        if (item.location && !locations.includes(item.location)) locations.push(item.location);
      });
      locations = locations.filter(Boolean);
      storageAvailable = true;
    } catch (e) {
      console.warn("localStorage unavailable; using memory only.", e);
      items = [];
      locations = [];
      storageAvailable = false;
    }
  }

  function saveStorage() {
    if (!storageAvailable) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) {
      console.warn("localStorage save failed; switching to memory only.", e);
      storageAvailable = false;
      updateRuntimeStatus();
    }
  }

  function saveLocations() {
    if (!storageAvailable) return;
    try {
      window.localStorage.setItem(LOCATIONS_KEY, JSON.stringify(locations));
    } catch (e) {
      console.warn("Location save failed.", e);
    }
  }

  function updateRuntimeStatus(message = "") {
    const el = $("runtimeStatus");
    if (!el) return;
    const mode = storageAvailable
      ? "✅ JavaScript起動済み・端末内保存が利用できます"
      : "⚠️ JavaScript起動済み・この開き方では端末内保存が使えないため一時保存で動作します";
    el.textContent = message ? `${mode}｜${message}` : mode;
  }

  function showView(viewName) {
    document.querySelectorAll(".app-view").forEach(view => {
      view.classList.toggle("hidden", view.id !== `${viewName}View`);
    });
    document.body.classList.toggle("scanner-mode", viewName === "scanner");
    if (viewName !== "scanner") stopScanner();
    if (viewName === "list" || viewName === "home") render();
    window.scrollTo({ top:0, behavior:"auto" });
  }

  function renderLocations() {
    const select = $("location");
    const selected = select.value;
    select.innerHTML = `<option value="">選択してください</option>` + locations.map(location =>
      `<option value="${escapeHtml(location)}">${escapeHtml(location)}</option>`
    ).join("");
    if (locations.includes(selected)) {
      select.value = selected;
    } else if (locations.length) {
      select.value = locations[0];
    }

    if (!locations.length) {
      $("locationList").innerHTML = `<div class="empty">保管場所はまだありません</div>`;
      return;
    }
    $("locationList").innerHTML = locations.map((location, index) => `
      <div class="location-row" data-location-index="${index}">
        <span>${escapeHtml(location)}</span>
        <div class="location-actions">
          <button class="drag-handle" type="button" draggable="true" data-index="${index}" aria-label="${escapeHtml(location)}をドラッグして並べ替え">≡</button>
          <button class="order-button moveLocationBtn" type="button" data-index="${index}" data-direction="-1" aria-label="${escapeHtml(location)}を上へ" ${index === 0 ? "disabled" : ""}>↑</button>
          <button class="order-button moveLocationBtn" type="button" data-index="${index}" data-direction="1" aria-label="${escapeHtml(location)}を下へ" ${index === locations.length - 1 ? "disabled" : ""}>↓</button>
          <button class="danger deleteLocationBtn" type="button" data-index="${index}">削除</button>
        </div>
      </div>`).join("");
    document.querySelectorAll(".drag-handle").forEach(handle => {
      handle.addEventListener("dragstart", event => {
        locationDragFrom = Number(handle.dataset.index);
        event.dataTransfer.effectAllowed = "move";
        handle.closest(".location-row").classList.add("drag-source");
      });
      handle.addEventListener("dragend", () => {
        locationDragFrom = null;
        document.querySelectorAll(".location-row").forEach(row => row.classList.remove("drag-source"));
      });
      handle.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse") return;
        locationDragFrom = Number(handle.dataset.index);
        handle.setPointerCapture(event.pointerId);
        handle.closest(".location-row").classList.add("drag-source");
      });
      handle.addEventListener("pointerup", event => {
        if (locationDragFrom === null) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const row = target && target.closest(".location-row");
        const to = row ? Number(row.dataset.locationIndex) : locationDragFrom;
        const from = locationDragFrom;
        locationDragFrom = null;
        if (from !== to && to >= 0 && to < locations.length) {
          const [moved] = locations.splice(from, 1);
          locations.splice(to, 0, moved);
          saveLocations();
        }
        renderLocations();
      });
    });
    document.querySelectorAll(".location-row").forEach(row => {
      row.addEventListener("dragover", event => event.preventDefault());
      row.addEventListener("drop", event => {
        event.preventDefault();
        const to = Number(row.dataset.locationIndex);
        if (locationDragFrom === null || locationDragFrom === to) return;
        const [moved] = locations.splice(locationDragFrom, 1);
        locations.splice(to, 0, moved);
        locationDragFrom = null;
        saveLocations();
        renderLocations();
      });
    });
    document.querySelectorAll(".moveLocationBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const from = Number(btn.dataset.index);
        const to = from + Number(btn.dataset.direction);
        if (to < 0 || to >= locations.length) return;
        [locations[from], locations[to]] = [locations[to], locations[from]];
        saveLocations();
        renderLocations();
      });
    });
    document.querySelectorAll(".deleteLocationBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        locations.splice(Number(btn.dataset.index), 1);
        saveLocations();
        renderLocations();
      });
    });
  }

  function newId() {
    return (window.crypto && typeof window.crypto.randomUUID === "function")
      ? window.crypto.randomUUID()
      : String(Date.now()) + "-" + Math.random().toString(16).slice(2);
  }

  function buildRegistration(existing = null) {
    return {
      id: existing ? existing.id : newId(),
      productName: $("productName").value.trim(),
      gtin: $("gtin").value.trim(),
      lot: $("lot").value.trim(),
      expiryMonth: $("expiryMonth").value,
      expiryRaw: $("expiryRaw").value.trim(),
      quantity: Number($("quantity").value || 1),
      location: $("location").value,
      createdAt: existing && existing.createdAt ? existing.createdAt : new Date().toISOString(),
      updatedAt: existing ? new Date().toISOString() : undefined
    };
  }

  function resetRegistrationForm() {
    ["productName","gtin","lot","expiryMonth","expiryRaw","rawGs1"].forEach(id => $(id).value = "");
    $("location").value = locations[0] || "";
    $("quantity").value = "1";
    $("rawDisplay").classList.add("hidden");
    editingItemId = null;

  function startEdit(itemId) {

    if (!item) return;
    editingItemId = item.id;
    registrationSource = "edit";
    $("productName").value = item.productName || "";
    $("gtin").value = item.gtin || "";

  function showScanSuccess() {
    const el = $("scanSuccess");
    if (!el) return;
    if (scanSuccessTimer) window.clearTimeout(scanSuccessTimer);
    el.classList.remove("hidden");
    scanSuccessTimer = window.setTimeout(() => {
      el.classList.add("hidden");
      scanSuccessTimer = null;
    }, 4000);
  }

  function stopScanner() {
    const video = $("video");
    const stream = video && video.srcObject;
    const tracks = stream && typeof stream.getTracks === "function" ? stream.getTracks() : [];
    tracks.forEach(track => {
      try { track.stop(); } catch (e) { console.warn("Camera track stop failed.", e); }
    });
    if (video) {
      video.pause();
      video.srcObject = null;
      video.removeAttribute("src");
      video.load();
    }

    if (controls && typeof controls.stop === "function") {
      try { controls.stop(); } catch (e) { console.warn("Scanner controls stop failed.", e); }
    }
    controls = null;

    if (scannerReader && typeof scannerReader.reset === "function") {
      try { scannerReader.reset(); } catch (e) { console.warn("Scanner reader reset failed.", e); }
    }
    scannerReader = null;
    activeVideoTrack = null;
    zoomState = null;
    $("zoomControls").classList.add("hidden");

  }

  function waitForCameraRelease() {
    return new Promise(resolve => window.setTimeout(resolve, 350));
  }

  function createDecodeHints() {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    hints.set(ZXing.DecodeHintType.ASSUME_GS1, true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.RSS_14,
      ZXing.BarcodeFormat.RSS_EXPANDED
    ]);
    return hints;
  }

  function setupZoomControls() {
    const video = $("video");
    const stream = video && video.srcObject;
    if (!stream || typeof stream.getVideoTracks !== "function") return;
    const track = stream.getVideoTracks()[0];
    if (!track) return;
    activeVideoTrack = track;

    const capabilities = typeof track.getCapabilities === "function"
      ? track.getCapabilities()
      : {};
    const settings = typeof track.getSettings === "function"
      ? track.getSettings()
      : {};
    if (!capabilities.zoom || typeof track.applyConstraints !== "function") return;

    zoomState = {
      min: Number(capabilities.zoom.min || 1),
      max: Number(capabilities.zoom.max || 1),
      step: Number(capabilities.zoom.step || 0.1),
      value: Number(settings.zoom || capabilities.zoom.min || 1)
    };
    $("zoomControls").classList.remove("hidden");
    updateZoomLabel();
  }

  function updateZoomLabel() {
    if (!zoomState) return;
    $("zoomValue").textContent = `ズーム ${zoomState.value.toFixed(1)}×`;
    $("zoomOutBtn").disabled = zoomState.value <= zoomState.min;
    $("zoomInBtn").disabled = zoomState.value >= zoomState.max;
  }

  async function changeZoom(direction) {
    if (!activeVideoTrack || !zoomState) return;
    const next = Math.min(
      zoomState.max,
      Math.max(zoomState.min, zoomState.value + zoomState.step * direction)
    );
    try {
      await activeVideoTrack.applyConstraints({ advanced:[{ zoom:next }] });
      zoomState.value = next;
      updateZoomLabel();
    } catch (e) {
      console.warn("Camera zoom failed.", e);
    }
  }

  function normalizeGs1(raw) {
    return raw
      .trim()
      .replace(/^\][A-Za-z0-9]{2}/, "")
      .replace(/\u001d/g, String.fromCharCode(29));
  }

  function parseBracketed(raw) {
    const out = {};
    const re = /\((\d{2,4})\)([^()]*)/g;
    let m;
    while ((m = re.exec(raw)) !== null) out[m[1]] = m[2].trim();
    return out;
  }

  function parseUnbracketed(raw) {
    const s = normalizeGs1(raw);
    const out = {};
    let i = 0;
    const GS = String.fromCharCode(29);

    while (i < s.length) {
      if (s[i] === GS) { i++; continue; }
      const ai2 = s.slice(i, i + 2);

      if (ai2 === "01" && i + 16 <= s.length) {
        out["01"] = s.slice(i + 2, i + 16);
        i += 16;
        continue;
      }
      if (ai2 === "17" && i + 8 <= s.length) {
        out["17"] = s.slice(i + 2, i + 8);
        i += 8;
        continue;
      }
      if (ai2 === "10") {
        let end = s.indexOf(GS, i + 2);
        if (end === -1) {
          // MVP: AI(10)が末尾の場合を最も確実に扱う。
          out["10"] = s.slice(i + 2);
          i = s.length;
        } else {
          out["10"] = s.slice(i + 2, end);
          i = end + 1;
        }
        continue;
      }

      // 未対応AIは1文字進めて既知AIを探す（MVP向け）
      i++;
    }
    return out;
  }

  function parseGS1(raw) {
    const parsed = raw.includes("(") ? parseBracketed(raw) : parseUnbracketed(raw);
    const gtin = parsed["01"] || "";
    const lot = parsed["10"] || "";
    const exp = parsed["17"] || "";
    let expiryMonth = "";

    if (/^\d{6}$/.test(exp)) {
      const yy = Number(exp.slice(0,2));
      const mm = exp.slice(2,4);
      const year = 2000 + yy;
      if (Number(mm) >= 1 && Number(mm) <= 12) expiryMonth = `${year}-${mm}`;
    }
    return { gtin, lot, expiryRaw: exp, expiryMonth, parsed };
  }

  function applyParsed(raw) {
    const r = parseGS1(raw);
    $("gtin").value = r.gtin;
    $("lot").value = r.lot;
    $("expiryRaw").value = r.expiryRaw;
    $("expiryMonth").value = r.expiryMonth;
    $("rawDisplay").textContent =
      `GTIN: ${r.gtin || "未取得"} / LOT: ${r.lot || "未取得"} / 有効期限: ${r.expiryMonth || "未取得"} / 生データ(17): ${r.expiryRaw || "未取得"}`;
    $("rawDisplay").classList.remove("hidden");

    if (r.gtin) {
      const previous = items.find(x => x.gtin === r.gtin && x.productName);
      if (previous && !$("productName").value) $("productName").value = previous.productName;
    }
    return r;
  }

  function monthIndex(ym) {
    if (!/^\d{4}-\d{2}$/.test(ym)) return null;
    const [y,m] = ym.split("-").map(Number);
    return y * 12 + (m - 1);
  }

  function statusFor(ym) {
    const idx = monthIndex(ym);
    if (idx === null) return { key:"unknown", label:"期限未設定", cls:"ok" };
    const now = new Date();
    const cur = now.getFullYear() * 12 + now.getMonth();
    const d = idx - cur;
    if (d < 0) return { key:"expired", label:"期限切れ", cls:"expired" };
    if (d === 0) return { key:"thismonth", label:"今月期限", cls:"thismonth" };
    if (d === 1) return { key:"nextmonth", label:"翌月期限", cls:"nextmonth" };
    if (d <= 3) return { key:"within3", label:"3か月以内", cls:"within3" };
    return { key:"ok", label:"期限余裕あり", cls:"ok" };
  }

  function formatYM(ym) {
    if (!ym) return "未設定";
    const [y,m] = ym.split("-");
    return `${y}/${m}`;
  }

  function render() {
    const counts = { expired:0, thismonth:0, nextmonth:0, within3:0 };
    items.forEach(x => {
      const s = statusFor(x.expiryMonth);
      if (counts[s.key] !== undefined) counts[s.key]++;
    });
    $("countExpired").textContent = counts.expired;
    $("countThis").textContent = counts.thismonth;
    $("countNext").textContent = counts.nextmonth;
    $("count3").textContent = counts.within3;
    $("listCountExpired").textContent = counts.expired;
    $("listCountThis").textContent = counts.thismonth;
    $("listCountNext").textContent = counts.nextmonth;
    $("listCount3").textContent = counts.within3;

    const q = $("search").value.trim().toLowerCase();
    let visible = items.filter(x => {
      const s = statusFor(x.expiryMonth);
      if (filter !== "all" && s.key !== filter) return false;
      if (!q) return true;
      return [x.productName, x.gtin, x.lot, x.location].join(" ").toLowerCase().includes(q);
    });

    visible.sort((a,b) => (a.expiryMonth || "9999-99").localeCompare(b.expiryMonth || "9999-99"));

    $("filterLabel").textContent = filter === "all" ? "期限順一覧" : `絞り込み：${{
      expired:"期限切れ", thismonth:"今月期限", nextmonth:"翌月期限", within3:"3か月以内"
    }[filter]}`;

    if (!visible.length) {
      $("list").innerHTML = `<div class="empty">該当する登録はありません</div>`;
      return;
    }

    $("list").innerHTML = visible.map(x => {
      const s = statusFor(x.expiryMonth);
      return `
        <div class="item">
          <div>
            <span class="badge ${s.cls}">${s.label}</span>
            <div class="item-title">${escapeHtml(x.productName || "商品名未設定")}</div>
            <div class="meta">
              有効期限 ${escapeHtml(formatYM(x.expiryMonth))}<br>
              LOT ${escapeHtml(x.lot || "-")} / 数量 ${escapeHtml(String(x.quantity || 1))}<br>
              GTIN ${escapeHtml(x.gtin || "-")}${x.location ? `<br>保管場所 ${escapeHtml(x.location)}` : ""}
            </div>
          </div>
          <div class="item-actions">
            <button class="secondary editBtn" type="button" data-id="${x.id}">編集</button>
            <button class="danger deleteBtn" type="button" data-id="${x.id}">削除</button>
          </div>
        </div>`;
    }).join("");

    document.querySelectorAll(".editBtn").forEach(btn => {
      btn.addEventListener("click", () => startEdit(btn.dataset.id));
    });
    document.querySelectorAll(".deleteBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        items = items.filter(x => x.id !== btn.dataset.id);
        saveStorage();
        render();
      });
    });
  }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  $("parseBtn").addEventListener("click", () => {
    try {
      const raw = $("rawGs1").value.trim();
      if (!raw) {
        updateRuntimeStatus("GS1文字列を入力してください");
        return;
      }
      applyParsed(raw);
      updateRuntimeStatus("GS1解析に成功しました");
      registrationSource = "manual";
      showView("registration");
    } catch (e) {
      console.error(e);
      updateRuntimeStatus("解析中にエラーが発生しました");
      alert("GS1解析中にエラーが発生しました。");
    }
  });

  $("saveBtn").addEventListener("click", () => {
    const expiryMonth = $("expiryMonth").value;
    if (!$("productName").value.trim()) return alert("商品名を入力してください。");
    if (!expiryMonth) return alert("有効期限（月）を入力してください。");

    if (editingItemId) {
      const index = items.findIndex(x => x.id === editingItemId);
      if (index === -1) return alert("編集対象が見つかりませんでした。");
      items[index] = buildRegistration(items[index]);
      saveStorage();
      resetRegistrationForm();
      render();
      updateRuntimeStatus("変更を保存しました");
      showView("list");
      return;
    }

    const candidate = buildRegistration();
    const duplicate = candidate.gtin && items.find(x =>
      x.gtin === candidate.gtin &&
      (x.lot || "") === candidate.lot &&
      x.expiryMonth === candidate.expiryMonth
    );
    if (duplicate) {
      pendingDuplicate = { candidate, duplicateId:duplicate.id };
      $("duplicateMessage").textContent = `同じGTIN・LOT・有効期限の登録があります。新しい数量 ${candidate.quantity} をどう処理しますか？`;
      $("duplicateDialog").showModal();
      return;
    }
    completeNewRegistration(candidate, "登録しました");
  });

  function completeNewRegistration(item, message) {
    items.push(item);
    saveStorage();
    resetRegistrationForm();
    filter = "all";
    render();
    updateRuntimeStatus(message);
    showView("home");
  }

  $("addQuantityBtn").addEventListener("click", () => {
    if (!pendingDuplicate) return;
    const existing = items.find(x => x.id === pendingDuplicate.duplicateId);
    if (existing) {
      existing.quantity = Number(existing.quantity || 1) + Number(pendingDuplicate.candidate.quantity || 1);
      existing.updatedAt = new Date().toISOString();
      saveStorage();
    }
    pendingDuplicate = null;
    $("duplicateDialog").close();
    resetRegistrationForm();
    render();
    updateRuntimeStatus("既存登録の数量へ加算しました");
    showView("home");
  });

  $("registerSeparateBtn").addEventListener("click", () => {
    if (!pendingDuplicate) return;
    const candidate = pendingDuplicate.candidate;
    pendingDuplicate = null;
    $("duplicateDialog").close();
    completeNewRegistration(candidate, "別の登録として追加しました");
  });

  $("cancelDuplicateBtn").addEventListener("click", () => {
    pendingDuplicate = null;
    $("duplicateDialog").close();
  });

  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      render();
      showView("list");
    });
  });
  $("showAllBtn").addEventListener("click", () => { filter = "all"; render(); });
  $("search").addEventListener("input", render);

  $("clearBtn").addEventListener("click", () => {
    if (!confirm("登録データをすべて削除しますか？この操作は元に戻せません。")) return;
    items = [];
    saveStorage();
    render();
    updateRuntimeStatus("登録データをクリアしました");
  });

  document.querySelectorAll("[data-back-home]").forEach(btn => {
    btn.addEventListener("click", () => showView("home"));
  });
  $("openManualBtn").addEventListener("click", () => {
    resetRegistrationForm();
    registrationSource = "home";
    updateRuntimeStatus("バーコードなしで登録できます");
    showView("registration");
  });
  $("openGs1TextBtn").addEventListener("click", () => showView("manual"));
  $("openListBtn").addEventListener("click", () => {
    filter = "all";
    showView("list");
  });
  $("backFromRegistrationBtn").addEventListener("click", () => {
    if (registrationSource === "edit") {
      resetRegistrationForm();
      showView("list");
    } else {
      showView(registrationSource === "manual" ? "manual" : "home");
    }
  });

  $("settingsBtn").addEventListener("click", () => {
    renderLocations();
    $("settingsDialog").showModal();
  });
  $("closeSettingsBtn").addEventListener("click", () => $("settingsDialog").close());

  $("addLocationBtn").addEventListener("click", () => {
    const location = $("newLocation").value.trim();
    if (!location) return;
    if (!locations.includes(location)) {
      locations.push(location);
      saveLocations();
    }
    $("newLocation").value = "";
    renderLocations();
  });
  $("newLocation").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      $("addLocationBtn").click();
    }
  });

  function downloadBlob(blob, filename) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], {type:"application/json"});
    downloadBlob(blob, `expiry-checker-${new Date().toISOString().slice(0,10)}.json`);
  });

  $("exportCsvBtn").addEventListener("click", () => {
    const escapeCsv = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
    const header = ["商品名","GTIN","LOT","有効期限","数量","保管場所","登録日時"];
    const rows = items.map(item => [
      item.productName, item.gtin, item.lot, item.expiryMonth,
      item.quantity, item.location, item.createdAt
    ]);
    const csv = "\uFEFF" + [header, ...rows].map(row => row.map(escapeCsv).join(",")).join("\r\n");
    downloadBlob(new Blob([csv], {type:"text/csv;charset=utf-8"}), `expiry-checker-${new Date().toISOString().slice(0,10)}.csv`);
  });

  function normalizeImportedItems(data) {
    if (!Array.isArray(data)) throw new Error("配列形式ではありません");
    return data.map((item, index) => {
      if (!item || typeof item !== "object") throw new Error(`${index + 1}件目がデータ形式ではありません`);
      const productName = String(item.productName || "").trim();
      const expiryMonth = String(item.expiryMonth || "");
      const quantity = Number(item.quantity || 1);
      if (!productName) throw new Error(`${index + 1}件目の商品名がありません`);
      if (!/^\d{4}-\d{2}$/.test(expiryMonth)) throw new Error(`${index + 1}件目の有効期限が不正です`);
      if (!Number.isFinite(quantity) || quantity < 1) throw new Error(`${index + 1}件目の数量が不正です`);
      return {
        id:newId(),
        productName,
        gtin:String(item.gtin || "").trim(),
        lot:String(item.lot || "").trim(),
        expiryMonth,
        expiryRaw:String(item.expiryRaw || "").trim(),
        quantity,
        location:String(item.location || "").trim(),
        createdAt:typeof item.createdAt === "string" ? item.createdAt : new Date().toISOString(),
        importedAt:new Date().toISOString()
      };
    });
  }

  $("importBtn").addEventListener("click", () => {
    $("importInput").value = "";
    $("importInput").click();
  });

  $("importInput").addEventListener("change", async event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      pendingImport = normalizeImportedItems(JSON.parse(await file.text()));
      $("importMessage").textContent = `${pendingImport.length}件のバックアップを確認しました。現在のデータへ追加するか、すべて置き換えるか選んでください。`;
      $("importDialog").showModal();
    } catch (e) {
      pendingImport = null;
      alert(`JSONバックアップを読み込めませんでした。${e.message || "形式を確認してください。"}`);
    } finally {
      event.target.value = "";
    }
  });

  function finishImport(mode) {
    if (!pendingImport) return;
    const imported = pendingImport;
    pendingImport = null;
    if (mode === "replace") items = imported;
    else items.push(...imported);
    imported.forEach(item => {
      if (item.location && !locations.includes(item.location)) locations.push(item.location);
    });
    saveLocations();
    saveStorage();
    renderLocations();
    render();
    $("importDialog").close();
    updateRuntimeStatus(`${imported.length}件を${mode === "replace" ? "復元" : "追加"}しました`);
  }

  $("importAddBtn").addEventListener("click", () => finishImport("add"));
  $("importReplaceBtn").addEventListener("click", () => {
    if (!pendingImport) return;
    if (!confirm(`現在の登録データをすべて削除し、${pendingImport.length}件のバックアップへ置き換えますか？`)) return;
    finishImport("replace");
  });
  $("cancelImportBtn").addEventListener("click", () => {
    pendingImport = null;
    $("importDialog").close();
  });

  $("openImageBtn").addEventListener("click", () => {
    $("imageInput").value = "";
    $("imageInput").click();
  });

  $("imageInput").addEventListener("change", async event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (!window.ZXing) {
      alert("ZXingライブラリを読み込めませんでした。インターネット接続を確認してください。");
      return;
    }

    const imageUrl = URL.createObjectURL(file);
    const imageReader = new ZXing.BrowserMultiFormatReader(createDecodeHints());
    updateRuntimeStatus("画像を解析しています");
    try {
      const result = await imageReader.decodeFromImageUrl(imageUrl);
      const parsed = applyParsed(result.getText());
      registrationSource = "image";
      updateRuntimeStatus(parsed.gtin || parsed.lot || parsed.expiryMonth
        ? "画像からGS1を読み取りました"
        : "コードを読み取りました。登録内容を確認してください");
      showView("registration");
    } catch (e) {
      console.warn("Image barcode decode failed.", e);
      updateRuntimeStatus("画像からコードを読み取れませんでした");
      alert("画像からGS1コードを読み取れませんでした。コードを大きく、正面から、明るく撮影して再度お試しください。");
    } finally {
      try { imageReader.reset(); } catch (e) { console.warn("Image reader reset failed.", e); }
      URL.revokeObjectURL(imageUrl);
      event.target.value = "";
    }
  });

  $("openScannerBtn").addEventListener("click", async () => {
    showView("scanner");
    scanHandled = false;
    $("scanSuccess").classList.add("hidden");
    if (!window.ZXing) {
      stopScanner();
      alert("ZXingライブラリを読み込めませんでした。インターネット接続を確認してください。");
      return;
    }
    try {
      stopScanner();
      scannerReader = new ZXing.BrowserMultiFormatReader(createDecodeHints(), 300);
      $("video").addEventListener("playing", setupZoomControls, { once:true });
      controls = await scannerReader.decodeFromConstraints({
        video:{
          facingMode:{ ideal:"environment" },
          width:{ ideal:1920 },
          height:{ ideal:1080 },
          aspectRatio:{ ideal:16 / 9 }
        },
        audio:false
      }, $("video"), async (result, err) => {
        if (result && !scanHandled) {
          scanHandled = true;
          const text = result.getText();
          $("rawGs1").value = text;
          applyParsed(text);
          showScanSuccess();
          updateRuntimeStatus("GS1読み取り成功・カメラ停止中");
          stopScanner();
          await waitForCameraRelease();
          registrationSource = "scanner";
          updateRuntimeStatus("GS1読み取りに成功しました");
          showView("registration");
        }
      });
    } catch (e) {
      console.error(e);
      stopScanner();
      alert("カメラを起動できませんでした。HTTPSまたはlocalhostで開き、カメラ許可を確認してください。");
    }
  });

  $("stopScanBtn").addEventListener("click", () => {
    stopScanner();
    updateRuntimeStatus("スキャンを停止しました");
    showView("home");
  });

  $("zoomOutBtn").addEventListener("click", () => changeZoom(-1));
  $("zoomInBtn").addEventListener("click", () => changeZoom(1));

  loadStorage();
  saveLocations();
  renderLocations();
  render();
  updateRuntimeStatus();
  showView("home");
})();
</script>
</body>
</html>
